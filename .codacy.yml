---
# Codacy analysis configuration.
#
# `codacy-cli` does not read this file -- it reads `.codacy/codacy.yaml` for
# runtimes and tools only -- so it is verified against the platform, which is
# the only place it has any effect.
#
# `exclude-patterns` is the documented mechanism for suppressing a specific
# issue by its message. The previous revision of this file used
# `tools.bandit.skip-checks`, which is not a key Codacy recognises: the file was
# accepted silently and the two findings survived unchanged, which is the worst
# possible outcome for a config -- it looks like it is doing something.
#
# B603 (`subprocess_without_shell_equals_true`) fires on every `subprocess` call
# that does not pass `shell=True`, so it fires on the SAFE form. Passing
# `shell=False` explicitly does not silence it, and neither does an inline
# suppression marker or a `[tool.bandit]` skip entry -- all three were tried and
# verified against the platform. It cannot tell a reviewed argv from an
# unreviewed one, and each of the two call sites carries a comment saying why
# its argv is safe.
#
# B602, which catches a real `shell=True` injection, is NOT matched here and
# stays enforced.
exclude-patterns:
  - 'Detected subprocess function'

# `uv.lock` is generated. Its single-line `sdist`/`wheel` records exceed 88
# characters whenever a package name or URL is long enough, and the file must not
# be hand-edited to satisfy a linter, so it is excluded from line-length checks
# rather than reformatted.
exclude-paths:
  - 'uv.lock'
