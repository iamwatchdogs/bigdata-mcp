# zizmor analyses the workflow files themselves. The pre-push hook runs the same
# analysis locally at medium+ severity and blocks; this job uploads findings to
# the Security tab so they are visible to anyone auditing the repository without
# cloning and running the hooks.
#
# Findings are uploaded but never fail this job. Two reasons: the local
# pre-push gate is already the blocking one, and making this job blocking too
# would require a second required status check, which the single "CI Status"
# gate exists to avoid. To make this blocking instead, add a code-scanning
# merge-protection rule rather than adding another required check.
name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

# Deny-all default. Every scope a job needs is granted on that job instead, so
# a new job cannot silently inherit write access to the repository.
permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload findings to the Security tab
      contents: read          # checkout
      actions: read           # read workflow metadata for the SARIF upload

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # zizmor only reads workflow files, so a sparse checkout avoids
          # pulling the source tree for a config-scanning job.
          sparse-checkout: .github

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
