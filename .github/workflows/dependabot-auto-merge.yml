name: Dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.user.type == 'Bot' &&
      github.repository == 'iamwatchdogs/bigdata-mcp'

    permissions:
      contents: write      # ref updates for `gh pr merge --auto`
      pull-requests: write # `gh pr review --approve` and enabling auto-merge
      issues: write        # labels are served by the issues API

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add dependabot label
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label "dependabot"

      - name: Evaluate merge policy
        id: policy
        env:
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          set -euo pipefail

          eligible=false
          reason=""

          if [ "$PACKAGE_ECOSYSTEM" = "github-actions" ]; then
            # Workflow changes are the highest-value target here, and an
            # action's behaviour can change without its version changing.
            reason="github-actions ecosystem is never auto-merged"

          elif [ "$PACKAGE_ECOSYSTEM" = "pre-commit" ]; then
            # Required CI does not exercise the full hook set: the prek-action
            # step in ci.yml skips actionlint, and the pre-push-only hooks
            # (zizmor, osv-scanner, gitleaks) never run in CI at all. A green
            # pipeline is not evidence that a bumped hook still works, and
            # patches have the same hole as minors.
            reason="pre-commit hooks are not fully exercised by required CI"

          elif [ "$PACKAGE_ECOSYSTEM" = "docker" ]; then
            # The devcontainer base image, pinned by digest in
            # .devcontainer/Dockerfile. This branch used to read "this
            # repository ships no container build", which stopped being true
            # when the devcontainer landed; the reason is now the real one.
            # A digest bump also arrives with no update-type, so it would fall
            # through to the fail-closed branch regardless, but naming it keeps
            # the log legible. Nothing in CI builds the image, so a green
            # pipeline says nothing about whether a new base still works. Every
            # base-image change gets a human.
            reason="docker base image bumps are not exercised by CI and need review"

          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            # The only eligible class: a patch is the one change that is
            # contractually behaviour-preserving, and it is still gated by the
            # full CI suite before the merge completes.
            eligible=true
            reason="semver-patch"

          else
            # Fail closed. Any unrecognised update-type lands here, including
            # an empty value, which is also how digest and branch updates
            # arrive.
            reason="update-type '${UPDATE_TYPE:-<empty>}' not eligible for ${PACKAGE_ECOSYSTEM}"
          fi

          {
            echo "eligible=$eligible"
            # A heredoc delimiter, not a bare `echo "reason=$reason"`, so a
            # reason containing `=` or a newline cannot corrupt the
            # GITHUB_OUTPUT parse. Belt-and-braces: reasons are script-controlled
            # and single-line today.
            echo "reason<<REASON_EOF"
            echo "$reason"
            echo "REASON_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Policy: eligible=$eligible ($reason)"

      - name: Approve and enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_URL"
          # --auto queues the merge and completes only once branch protection
          # is satisfied, so the required `CI Status` check still has to pass.
          # --admin is never used: it bypasses exactly the protection this
          # workflow is designed to respect.
          gh pr merge --auto --squash "$PR_URL"
