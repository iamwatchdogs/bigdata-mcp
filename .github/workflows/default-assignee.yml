name: Assign default owner

# Three triggers, because "who owns this" is asked in three different places:
# a new issue, a new pull request, and an unassigned code-scanning alert that
# only appears after CodeQL finishes.
#
# Every privileged trigger here is `pull_request_target` or `workflow_run`, both
# of which run with a write token against code an attacker may control. That is
# safe only because this workflow never checks out the PR and never runs PR
# code. Its steps are fixed `gh api` calls against hardcoded endpoints, with the
# only variable input read from `env:` and never interpolated into a `run:`
# script. Do not add a checkout, a build step, or an interpolation here.
on:
  issues:
    types: [opened]

  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

  workflow_run: # zizmor: ignore[dangerous-triggers]
    # Must match `name:` in codeql.yml EXACTLY. A `workflow_run` filter matches
    # on the workflow's name, not its file, so a rename on either side silently
    # stops the code-scanning assignment from ever running again -- with no
    # error anywhere. tests/test_repo_contracts.py asserts the two agree.
    workflows: ["CodeQL Advanced"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.event.number` rather than `github.event.issue.number` /
  # `github.event.pull_request.number`: it is the same integer on both payloads,
  # and it is assigned by GitHub rather than being attacker-supplied text. The
  # untrusted-input contract test forbids the `pull_request.*` / `issue.*`
  # prefixes outside an `env:` mapping on principle, and this satisfies it
  # without weakening the test for the fields that genuinely are injectable
  # (branch names, PR titles, author-controlled strings).
  group: default-assignee-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  assign-new-work:
    name: Assign new issue or pull request
    if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write         # the assignees endpoint is served by the issues API
      pull-requests: write  # required for a PR's issue-shaped payload

    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          # The assignees endpoint is issue-shaped, so an issue and a pull
          # request use the same URL with different numbers.
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DEFAULT_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            -f "assignees[]=${DEFAULT_ASSIGNEE}" > /dev/null; then
            echo "Assigned ${DEFAULT_ASSIGNEE} to #${ISSUE_NUMBER}"
          else
            echo "::error::Failed to assign ${DEFAULT_ASSIGNEE} to #${ISSUE_NUMBER}"
            exit 1
          fi

  assign-code-scanning-alerts:
    name: Assign unassigned code-scanning alerts
    # Only after a successful CodeQL run, so alerts exist to be assigned, and
    # never after a failed or cancelled one.
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # the alerts API requires it to reassign findings

    steps:
      - name: Assign unassigned code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Page through every open unassigned alert. `--paginate` is required
          # because the default page is 30 and a repository accumulates more
          # than that; silently assigning only the first page would leave
          # findings looking deliberately unowned.
          alerts="$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&assignees=none&per_page=100" \
              --jq '[.[][] | .number] | .[]'
          )"

          if [ -z "$alerts" ]; then
            echo "No unassigned code-scanning alerts."
            exit 0
          fi

          # --silent keeps the full alert payloads, which include the matched
          # source snippets, out of the workflow log. A code-scanning finding
          # is a statement about a vulnerability, and routine CI logs are the
          # wrong place to publish it.
          while read -r number; do
            gh api \
              --method PATCH \
              --silent \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${number}" \
              -f "assignees[]=${DEFAULT_ASSIGNEE}"
            printf 'Assigned alert %s to %s\n' "$number" "$DEFAULT_ASSIGNEE"
          done <<< "$alerts"
