name: Assign default owner

on:
  issues:
    types: [opened]

  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened]

  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CodeQL Advanced"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: default-assignee-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  assign-new-work:
    name: Assign new issue or pull request
    if: ${{ github.event_name == 'issues' || github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write         # the assignees endpoint is served by the issues API
      pull-requests: write  # required for a PR's issue-shaped payload

    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          DEFAULT_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            -f "assignees[]=${DEFAULT_ASSIGNEE}" > /dev/null; then
            echo "Assigned ${DEFAULT_ASSIGNEE} to #${ISSUE_NUMBER}"
          else
            echo "::error::Failed to assign ${DEFAULT_ASSIGNEE} to #${ISSUE_NUMBER}"
            exit 1
          fi

  assign-code-scanning-alerts:
    name: Assign unassigned code-scanning alerts
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # the alerts API requires it to reassign findings

    steps:
      - name: Assign unassigned code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Page through every open unassigned alert: the default page is 30, and
          # assigning only the first page would leave findings looking
          # deliberately unowned.
          #
          # No `--slurp`: `gh api` rejects it together with `--jq` and exits
          # nonzero, so with `set -e` the step aborted before assigning anything.
          # It is not needed either -- `--paginate` applies `--jq` to EACH page,
          # and each page is already a top-level array.
          alerts="$(
            gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&assignees=none&per_page=100" \
              --jq '.[] | .number'
          )"

          if [ -z "$alerts" ]; then
            echo "No unassigned code-scanning alerts."
            exit 0
          fi

          # --silent keeps the alert payloads, which include the matched source
          # snippets, out of the workflow log. A code-scanning finding is a
          # statement about a vulnerability, and routine CI logs are the wrong
          # place to publish it.
          while read -r number; do
            gh api \
              --method PATCH \
              --silent \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts/${number}" \
              -f "assignees[]=${DEFAULT_ASSIGNEE}"
            printf 'Assigned alert %s to %s\n' "$number" "$DEFAULT_ASSIGNEE"
          done <<< "$alerts"
