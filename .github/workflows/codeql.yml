# CodeQL advanced analysis for the Python source and the workflow files
# themselves. `security-extended` rather than the default query suite: the
# default misses whole classes of injection and unsafe-deserialization bugs,
# and the workflow surface is the highest-value target in this repository.
#
# NOTE: do not also enable CodeQL's "default setup" in repository settings. It
# installs its own competing workflow and disables this one, including its
# uploads.
name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 03:30 UTC. New queries ship on their own cadence, so a scheduled
    # run is the only way findings from newly released rules reach an existing
    # codebase that is not currently being changed.
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  # The scheduled run gets its own group. `cancel-in-progress` is evaluated on
  # the *arriving* run, so a shared group would let an ordinary push cancel the
  # weekly scan before it finished.
  group: codeql-${{ github.ref }}${{ github.event_name == 'schedule' && '-scheduled' || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload SARIF findings to the Security tab
      packages: read         # fetch private or internal CodeQL packs
      actions: read          # private repos: read workflow metadata for SARIF
      contents: read         # checkout

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # No build step. The package is pure Python with no compiled
          # extension, and `none` is the documented mode for that.
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          # Required so the two languages land as separate categories instead of
          # one analysis overwriting the other's results.
          category: "/language:${{ matrix.language }}"
