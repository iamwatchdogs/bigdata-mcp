name: CI


on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run-all:
        description: "Force all jobs (release gate); bypasses path filtering"
        required: false
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    if: ${{ !inputs.run-all }}

    runs-on: ubuntu-latest
    permissions:
      contents: read      # checkout on push / workflow_dispatch / workflow_call
      pull-requests: read # dorny/paths-filter lists PR files over the REST API

    outputs:
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      json: ${{ steps.filter.outputs.json }}

    steps:
      - name: Check out the repo
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'src/**/*.py'
              - 'tests/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - 'Makefile'
            workflows:
              - '.github/workflows/*.yml'
              - '.github/workflows/*.yaml'
              - '.github/dependabot.yml'
              - '.github/CODEOWNERS'
            json:
              - '**/*.json'
              - '**/*.jsonl'

  lint-gh-workflows:
    needs: [detect-changes]
    if: |
      (inputs.run-all ||
      needs.detect-changes.outputs.workflows == 'true') &&
      !failure() &&
      !cancelled()

    name: Lint GH Action workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: v1.7.12

  lint-json:
    needs: [detect-changes]
    if: |
      (inputs.run-all ||
      needs.detect-changes.outputs.json == 'true') &&
      !failure() &&
      !cancelled()

    name: Lint JSON/JSONL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure ripgrep
        run: command -v rg >/dev/null || sudo apt-get install -y ripgrep

      - name: Validate JSONL with jq
        if: ${{ hashFiles('**/*.jsonl') != '' }}
        run: |
          set -euo pipefail
          # NUL-delimited read into a bash array rather than xargs+sh -c, so
          # filenames with spaces or quotes survive and no single-quoted
          # inner script is needed.
          mapfile -d '' files < <(rg --files --hidden --no-follow --null -g '*.jsonl')
          for file in "${files[@]}"; do
            printf 'jq: %s\n' "$file"
            jq empty "$file" > /dev/null
          done

      - name: Validate JSONL with Python
        if: ${{ hashFiles('**/*.jsonl') != '' }}
        run: |
          set -euo pipefail
          rg --files --hidden --no-follow --null -g '*.jsonl' \
            | xargs -0 -r -n1 python -m json.tool --json-lines --compact > /dev/null

      - name: Validate JSON
        if: ${{ hashFiles('**/*.json') != '' }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(rg --files --hidden --no-follow --null -g '*.json')
          for file in "${files[@]}"; do
            printf 'json: %s\n' "$file"
            python -m json.tool --compact "$file" > /dev/null
          done

  precheck-ci-pipeline:
    needs: [detect-changes]
    if: |
      (inputs.run-all ||
      needs.detect-changes.outputs.python == 'true') &&
      !failure() &&
      !cancelled()

    name: Lint Python
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv with Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Setup project
        run: uv sync --locked

      - name: Run linting
        run: uv run ruff check src tests

      - name: Run type checking
        run: uv run ty check src

      - name: Run precommit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: ruff-check,ruff-format,ty,pytest-testmon,no-commit-to-branch,actionlint

  test-matrix-pipeline:
    needs: [detect-changes]
    if: |
      (inputs.run-all ||
      needs.detect-changes.outputs.python == 'true') &&
      !failure() &&
      !cancelled()

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
      fail-fast: false

    name: Python Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Required only by actions/upload-code-coverage, which publishes to
      # GitHub's built-in coverage. Scoped to this job so the other jobs in
      # this workflow do not carry it.
      code-quality: write

    env:
      IS_COVERAGE_RUN: >-
        ${{ matrix.os == 'ubuntu-latest' &&
        matrix.python-version == '3.14' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Setup project
        run: uv sync --locked

      - name: Run tests with coverage
        if: env.IS_COVERAGE_RUN == 'true'
        run: uv run pytest --cov-report=xml

      - name: Run tests
        if: env.IS_COVERAGE_RUN != 'true'
        run: uv run pytest --no-cov

      - name: Upload coverage to Codecov
        if: env.IS_COVERAGE_RUN == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # GitHub's OWN built-in coverage, which is what the `code_coverage`
      # ruleset rule evaluates. Codecov and this are separate systems: the ruleset
      # rule does not read Codecov's numbers, so without this step
      # `minimum_coverage` in the branch ruleset has nothing to measure and the
      # rule is inert.
      #
      # Both uploads run on purpose. This one feeds the merge gate and the PR
      # comment from github-code-quality[bot]; Codecov keeps the history,
      # dashboard, and trend data.
      #
      # Uploaded on pushes to main rather than on every pull request: a PR from
      # a fork has no `code-quality: write` here, and the ruleset evaluates
      # coverage relative to the default branch anyway. `fail-on-error: false`
      # for the same reason as the `if:` -- an upload the token cannot perform
      # is not a coverage regression, and failing the job for it would make
      # every fork PR red for no reason.
      - name: Upload coverage to GitHub
        if: >-
          env.IS_COVERAGE_RUN == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
          fail-on-error: false

  ci-status-checker:
    name: CI Status

    needs:
      - detect-changes
      - lint-gh-workflows
      - lint-json
      - precheck-ci-pipeline
      - test-matrix-pipeline
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Fail unless every applicable job succeeded
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          WORKFLOWS_FILTER: ${{ needs.detect-changes.outputs.workflows }}
          JSON_FILTER: ${{ needs.detect-changes.outputs.json }}
          PYTHON_FILTER: ${{ needs.detect-changes.outputs.python }}
          LINT_WORKFLOWS_RESULT: ${{ needs.lint-gh-workflows.result }}
          LINT_JSON_RESULT: ${{ needs.lint-json.result }}
          PRECHECK_CI_PIPELINE_RESULT: ${{ needs.precheck-ci-pipeline.result }}
          TEST_MATRIX_PIPELINE_RESULT: ${{ needs.test-matrix-pipeline.result }}
        run: |
          failed=''

          # allow(): $1 = filter output from detect-changes, $2 = job result.
          # Pass if succeeded, or skipped with explicit "false" filter provenance.
          allow() {
            [ "$2" = success ] && return 0
            [ "$2" = skipped ] && [ "$1" = false ] && return 0
            return 1
          }

          # detect-changes has no filter of its own; "skipped" only happens when
          # run-all forces every job, which is legitimate.
          case "$DETECT_CHANGES_RESULT" in
            success|skipped) printf '✅ Detect changes: %s\n' "$DETECT_CHANGES_RESULT" ;;
            *) printf '❌ Detect changes: %s\n' "$DETECT_CHANGES_RESULT"; failed=1 ;;
          esac

          if allow "$WORKFLOWS_FILTER" "$LINT_WORKFLOWS_RESULT"; then
            printf '✅ Lint workflows: %s\n' "$LINT_WORKFLOWS_RESULT"
          else
            printf '❌ Lint workflows: %s (filter: %s)\n' "$LINT_WORKFLOWS_RESULT" "$WORKFLOWS_FILTER"
            failed=1
          fi

          if allow "$JSON_FILTER" "$LINT_JSON_RESULT"; then
            printf '✅ Lint JSON/JSONL: %s\n' "$LINT_JSON_RESULT"
          else
            printf '❌ Lint JSON/JSONL: %s (filter: %s)\n' "$LINT_JSON_RESULT" "$JSON_FILTER"
            failed=1
          fi

          if allow "$PYTHON_FILTER" "$PRECHECK_CI_PIPELINE_RESULT"; then
            printf '✅ Lint Python: %s\n' "$PRECHECK_CI_PIPELINE_RESULT"
          else
            printf '❌ Lint Python: %s (filter: %s)\n' "$PRECHECK_CI_PIPELINE_RESULT" "$PYTHON_FILTER"
            failed=1
          fi

          if allow "$PYTHON_FILTER" "$TEST_MATRIX_PIPELINE_RESULT"; then
            printf '✅ Test CI (matrix): %s\n' "$TEST_MATRIX_PIPELINE_RESULT"
          else
            printf '❌ Test CI (matrix): %s (filter: %s)\n' "$TEST_MATRIX_PIPELINE_RESULT" "$PYTHON_FILTER"
            failed=1
          fi

          if [ -n "$failed" ]; then
            echo "::error::One or more CI jobs did not succeed (or the run was cancelled); see the results above."
            exit 1
          fi

          echo "All applicable CI jobs succeeded."
