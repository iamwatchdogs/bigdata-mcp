default_language_version:
  python: python3.14

# Install shims for both stages: fast checks gate every commit, the security
# gate (zizmor / osv-scanner / gitleaks) runs once per push.
default_install_hook_types: [pre-commit, pre-push]

# Hooks without an explicit `stages:` run at commit time only, so the security
# hooks below never slow down routine commits.
default_stages: [pre-commit]

exclude: ^(build|dist|\.eggs|\.git|\.hg|\.tox|\.venv|_build|buck-out)$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        name: "ruff lint"
        args:
          - --fix
          - --exit-non-zero-on-fix
        types_or: [python, pyi]
      - id: ruff-format
        name: "ruff format"
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: ty
        name: "ty type check"
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: ^(src|tests)/

      - id: complexipy
        name: "complexipy complexity gate"
        entry: uv run complexipy src --max-complexity-allowed 15
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: "hygiene trailing whitespace"
      - id: end-of-file-fixer
        name: "hygiene end of file newline"
      - id: mixed-line-ending
        name: "hygiene mixed line endings"
        args: [--fix=lf]

      - id: check-yaml
        name: "hygiene validate YAML"
      - id: check-toml
        name: "hygiene validate TOML"
      - id: check-json
        name: "hygiene validate JSON"

      - id: check-ast
        name: "hygiene validate Python AST"
      - id: debug-statements
        name: "hygiene block debug statements"
      - id: check-builtin-literals
        name: "hygiene literal builtins"

      - id: check-merge-conflict
        name: "hygiene merge conflict markers"
      - id: detect-private-key
        name: "security block private keys (commit time)"
      - id: check-added-large-files
        name: "hygiene large file guard"
        args: [--maxkb=500]
      - id: no-commit-to-branch
        name: "hygiene protect main branch"
        args: [--branch, main]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: "lint github actions workflows"
        # Default file set (.github/workflows/**) is correct. Do not broaden
        # this to other YAML under .github/: dependabot.yml is not an Actions
        # workflow, and actionlint's parser rejects its top-level `updates:`
        # key as an unknown workflow section. dependabot.yml is validated by
        # `check-yaml` (pre-commit-hooks) instead.

  - repo: local
    hooks:
      - id: pytest-testmon
        name: pytest-testmon on changed Python files
        # Routed through `make testmon` rather than inlining the command, so the
        # hook and the Makefile can never drift — the same single-source rule
        # the rest of this file and the Makefile are built around.
        #
        # The flags live in the Makefile target because `--no-cov` is
        # load-bearing: testmon runs a *subset* of the suite, so a coverage
        # percentage over that subset is not a meaningful number, and when
        # testmon selects nothing at all coverage is 0%, which made
        # `[tool.coverage.report] fail_under` fail the commit hook for a reason
        # unrelated to the code under review. The floor is enforced by the full
        # suite instead: `make test` locally, and the pytest invocation in the
        # CI matrix.
        entry: make testmon
        language: system
        files: ^(tests|src)/.*\.py$
        types: [python]

      - id: bandit
        name: "security bandit (python security analysis)"
        # Codacy reported Bandit on every pull request as an advisory finding
        # that nothing failed on, and its config has since been removed from
        # this repository. This makes the same class of finding fail closed
        # locally and in the pre-push stage.
        #
        # The skip list lives in `[tool.bandit]` in pyproject.toml, where each
        # entry carries its own justification, and
        # `test_bandit_skip_list_is_exactly_the_reviewed_set` asserts the list
        # has not grown. Scoped to the first-party trees: `.venv` is excluded
        # because `-r` is given explicit roots rather than a bare directory.
        #
        # Bandit is installed HERE, in the hook's own environment, rather than
        # as a project dev-dependency. That is not a packaging preference: as a
        # dev-dependency it lands in uv.lock, and uv writes each sdist and wheel
        # record as a single line, so a package with a long name or URL pushes
        # those lines past the line-length limit that the third-party analysers
        # enforce on a file that must never be hand-edited to satisfy a linter.
        # The gate is worth having and the lock file is worth not churning, so
        # the tool goes where the tool belongs. Pinned to an exact version for
        # the same reason every other hook revision in this file is.
        entry: bandit -q -r src scripts tests -c pyproject.toml
        language: python
        additional_dependencies: ["bandit==1.9.4"]
        files: ^(src|tests|scripts)/.*\.py$|^pyproject\.toml$
        types: [python]
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Security gate — pre-push stage. Local replicas of the CI security
  # workflows so insecure code never leaves the machine
  # ---------------------------------------------------------------------------
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        name: "security zizmor (actions SAST)"
        args: [--min-severity=medium]  # block on actionable findings; CI upload stays advisory
        stages: [pre-push]

  - repo: https://github.com/google/osv-scanner
    rev: v2.6.0
    hooks:
      - id: osv-scanner
        name: "security osv-scanner (dependency review)"
        stages: [pre-push]

  - repo: local
    hooks:
      - id: gitleaks
        name: "security gitleaks (secrets in history)"
        entry: gitleaks git --redact --verbose
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.1]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: codacy
        name: "security codacy (SAST + complexity)"
        # `codacy-cli analyze` exits 0 in every case that matters -- clean tree,
        # a confirmed finding, a missing config, a malformed one -- so its exit
        # status cannot be the gate. scripts/codacy_gate.py reads the finding
        # count out of SARIF instead, and treats an unreadable report as a
        # failure rather than as zero findings.
        #
        # It is a wrapper rather than a bare `codacy-cli analyze` for two
        # measured reasons. The analyser walks the current directory with no
        # exclusion mechanism -- `exclude_paths` in .codacy/codacy.yaml is
        # ignored -- so it spent 9m11s producing 860 findings that were all
        # inside .venv, against 1m12s and 0 findings for the same config over
        # the source trees alone. And it skips a directory named `tests`
        # silently, which is half the first-party Python here. The gate stages
        # the trees into a temporary directory, renaming `tests` as it goes.
        # Its reasoning, and the measurements behind it, are in the script.
        #
        # Every finding fails. There is no suppression list: a baseline is what
        # makes a security gate report the same green line while the thing it
        # guards has changed.
        entry: uv run python scripts/codacy_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: coderabbit-advisory
        name: "advisory coderabbit (stored findings, no cloud call)"
        # Advisory only, and never blocking. It prints findings left by an
        # earlier `coderabbit review` and always exits 0, for two measured
        # reasons.
        #
        # `coderabbit review` is a cloud LLM call: `doctor` lists a reachable
        # backend and WebSocket as prerequisites, `--remote` reviews "on the
        # server without a local checkout", and the account has 3 reviews per
        # hour. A non-deterministic, billable command does not belong in a
        # pre-push gate, so it is not run here.
        #
        # `coderabbit review findings` is the local half. It reads
        # ~/.coderabbit/ and was verified to work with the network blocked --
        # every proxy pointed at a dead port -- while `coderabbit doctor` under
        # those same conditions reports "Cannot reach https://app.coderabbit.ai"
        # and exits nonzero. So this costs no credits and no inference.
        #
        # Its limit is stated here because it is the whole caveat: these are the
        # findings of the LAST review, not of the commits being pushed, so they
        # can be stale. A stale advisory is still worth printing; a stale one
        # that blocks a push is not.
        #
        # A wrapper, not `coderabbit review findings || true`: prek does not run
        # an entry through a shell, so that arrives as two literal CLI arguments
        # and fails with "too many arguments for 'findings'". The script owns
        # the exit status instead.
        entry: uv run python scripts/coderabbit_advisory.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
