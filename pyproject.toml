[project]
name = "bigdata-mcp"
version = "0.1.0"
description = "MCP server that registers multiple read-only big data sources so agents can query them through a single interface"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "iamwatchdogs", email = "shamith301102@gmail.com" }
]
# Keep in step with .python-version, [tool.ty.environment] python-version and
# [tool.ruff] target-version: a lower floor claims support lint and type
# checking never verified, and the CI matrix only tests 3.14.
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
    # C4 (§14.3): the strict load validates the PARSED TOML against
    # schemas/config.schema.json with additionalProperties:false. Hand-rolling
    # that would put a second, divergent definition of the rules in the tree.
    "jsonschema>=4.25.1",
    "mcp>=2.3.0",
]

[project.scripts]
bigdata-mcp = "bigdata_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "time-machine>=2.19.0",
    "ty>=0.0.84",
]

# `all = "error"` is the ceiling over ty's own 139 rules -- there is no stricter
# setting. What ty has no equivalent for is pyright strict's `reportUnknown*`
# family, so the JSON boundaries in `scripts/` are annotated `object` rather than
# `Any`: `Any` is compatible with everything in both directions and so suppresses
# the finding, while `object` lets the already-armed `unsound-return-statement`
# and `invalid-return-type` rules report it. See the failure ledger in AGENTS.md.
[tool.ty]
rules = { all = "error" }

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
# A `# type: ignore` is written to silence *another* checker and is routinely
# wrong about this one. Closing it means `ty: ignore` is the only escape, and
# `# type: ignore` can no longer hide a defect from CI. Stricter than pyright
# strict, which leaves `enableTypeIgnoreComments` on in all four modes.
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.14"

# Pinned rather than left to ty's project auto-detection, because three callers
# disagreed about the scope: the Makefile ran a bare `ty check`, CI ran
# `ty check src`, and the prek hook fired on `^(src|tests)/`. Two of the three
# never looked at `scripts/`, which is where both gates live.
[tool.ty.src]
include = ["src", "scripts", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 88
target-version = "py314"
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "A",
    "ANN",
    "S",
    "BLE",
    "FBT",
    "C4",
    "C90",
    "DTZ",
    "T10",
    "EM",
    "FA",
    "ICN",
    "INP",
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "PIE",
    "T20",
    "PT",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    "TID",    # flake8-tidy-imports
    "TC",
    "ARG",
    "PTH",
    "TD",     # flake8-todos
    "TRY",
    "PERF",
    "FURB",
    "RUF",
    "D",
    "DOC",    # pydoclint: args/returns must match the signature
]
ignore = [
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undocumented-public-package"]
# Both roots, listed separately because TOML has no way to alias one list into
# another pattern, and the two suites ignore the same four rules for the same
# reason: `assert` is what pytest evaluates, and `D`/`ANN`/`ARG` are noise on a
# test. Widening either root's rules has to be done here twice, deliberately.
"tests/**/*.py" = ["assert", "D", "ANN", "ARG"]
"scripts/tests/**/*.py" = ["assert", "D", "ANN", "ARG"]
# Executable tooling, not a library: run by `make` and by the pre-commit hook,
# so a `__main__` guard and a `print`-based usage message are correct rather
# than violations. S404/S603 are suppressed at the call site, where the argv is
# fixed.
"scripts/**/*.py" = ["T20", "INP"]
# The capture CLI is the one library module whose job is to talk to a human: its
# output *is* the deliverable, because an ssh_cli capture cannot be taken
# programmatically and the manual recipe is the fallback the spec requires be
# printed rather than discovered. Scoped to the single module so T20 stays live
# everywhere else -- a stray print in the engine is a stdout-purity failure, and
# SPEC.md §6.2 requires stdout to be exactly one JSON object.
"src/bigdata_mcp/capture.py" = ["T20"]
# S607 (partial-path argv) applies to exactly three call sites, all in the
# repository's own gates, which spell their argv inline so Opengrep's
# `dangerous-subprocess-use-audit` sees a literal. The bare name is deliberate:
# a `sys.executable`-relative argv is not exempt either, and an absolute path
# would silence the check by hardcoding one machine's install prefix. Each call
# is preceded by a `shutil.which` check, and pre-commit prepends the hook's venv
# `bin` to `PATH`, so check and call resolve to the same binary. Scoped per file
# so the next script spawning a bare name has to come back and say why.
"scripts/coderabbit_advisory.py" = ["start-process-with-partial-path"]
"scripts/bandit_gate.py" = ["subprocess-without-shell-equals-true", "start-process-with-partial-path"]
"scripts/codacy_gate.py" = ["subprocess-without-shell-equals-true", "start-process-with-partial-path"]
"scripts/coverage_gate.py" = ["subprocess-without-shell-equals-true", "start-process-with-partial-path"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["bigdata_mcp"]

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
# `src` for the package under test, `scripts` so a test there can import the tool
# it is testing by name instead of rebuilding a path to reach it.
pythonpath = ["src", "scripts"]
addopts = "--cov=bigdata_mcp --cov-report=term-missing -v -n auto"

[tool.coverage.run]
# Branch coverage, not just line: a function whose every line runs but whose
# only `if` is never taken reports as fully covered.
branch = true

[tool.coverage.report]
# A floor, not a target, and never lower it to make a failing run pass -- fix
# the missing test instead.
#
# 95% is the number, and it lives here as the source of truth for two reasons.
#
# * `codecov.yml` states the same 95% for Codecov's `project` and `patch`
#   statuses. `scripts/tests/test_repo_contracts.py` asserts the two agree, so
#   neither can be changed alone.
# * `scripts/coverage_gate.py` reads this value and applies it to every file
#   individually. Neither coverage.py (a single `fail_under` float, compared
#   against the total) nor Codecov (`project` and `patch` statuses, also totals)
#   can enforce a per-file floor, so one file could fall to 50% while the other
#   twenty-four held the number and every gate stayed green. The gate owns no
#   percentage of its own -- `make coverage-per-file` and the CI coverage step
#   both run it, and `make test` chains it after the run that produced the data.
fail_under = 95
show_missing = true
# Nothing to exclude: `src` is on sys.path via pytest's `pythonpath` and the
# `__main__` guard is exercised by runpy in tests/test_main.py.

[tool.bandit]
# Codacy reported Bandit on every PR as an advisory finding that nothing failed
# on, and its config has since been removed from this repository, so the signal
# is third-party again. This gate makes the same class of finding local and
# fail-closed. Each skip fires on correct code in THIS repository and carries
# its own justification below, so widening the list is a deliberate edit rather
# than a quiet one.
#
# B101 assert_used — a pytest suite is built from `assert`. The ruff equivalent
#   (S101) is suppressed for both test roots above for the same reason, and `make
#   test` runs pytest, which is what evaluates those asserts.
#
# B404 import_subprocess — fires on ANY import of `subprocess`.
#   with_testmon_lock.py exists to run a command under a lock and two test
#   modules spawn interpreters, so it can never be clean here.
#
# B603 subprocess_without_shell_equals_true — fires on a non-literal argv, which
#   is the SAFE form: it flags the caller, not the command. Its dangerous
#   neighbour B602 (`shell=True`) is NOT skipped, so shell injection stays a
#   hard failure. What is given up is telling a good argv from a bad one by
#   inspection, which is not a distinction a linter can make anyway.
#
# B607 start_process_with_partial_path — fires on a bare command name. The three
#   such calls are the gates' own, and deliberate: Opengrep exempts only an argv
#   literal, so a `shutil.which` result and a `sys.executable`-relative argv are
#   both reported, while an absolute path would silence the check by binding one
#   machine's install prefix. Same trade as the S607 ignores above.
#
# B608 hardcoded_sql_expressions — no database and no SQL here. The single hit
#   is a false positive on the word "update" inside a create-versus-update
#   assertion message.
skips = ["B101", "B404", "B603", "B607", "B608"]
